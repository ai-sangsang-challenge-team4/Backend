spring.application.name=teacherhub
spring.flyway.enabled=false
teacherhub.policy.version=2026-10-29-v1

ai.server.url=http://localhost:8000
ai.server.connect-timeout-ms=${AI_SERVER_CONNECT_TIMEOUT_MS:2000}
ai.server.request-timeout-ms=${AI_SERVER_REQUEST_TIMEOUT_MS:5000}

risk.repeat.window-days=${RISK_REPEAT_WINDOW_DAYS:7}
risk.repeat.threshold=${RISK_REPEAT_THRESHOLD:3}
risk.repeat.max-messages=${RISK_REPEAT_MAX_MESSAGES:20}
risk.repeat.max-characters=${RISK_REPEAT_MAX_CHARACTERS:8000}
