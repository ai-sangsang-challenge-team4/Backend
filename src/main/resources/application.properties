spring.application.name=teacherhub
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
teacherhub.policy.version=2026-10-29-v1

ai.server.url=http://localhost:8000

# 반복성 판단은 동일 민원의 최근 전송 이력만 사용한다. 전체 기간의 횟수는 유지하되
# 외부 AI에는 최신 20개, 마스킹된 본문 합계 8,000자까지만 전달한다.
risk.repeat.window-days=${RISK_REPEAT_WINDOW_DAYS:30}
risk.repeat.max-messages=${RISK_REPEAT_MAX_MESSAGES:20}
risk.repeat.max-characters=${RISK_REPEAT_MAX_CHARACTERS:8000}
